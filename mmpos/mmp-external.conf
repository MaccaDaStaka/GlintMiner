# GlintMiner as an MMPOS external (custom) miner. Fields per MMPOS's custom-miner format.
NAME=glint
VERSION=1.2.5
ALGO=pearl
# Start command: MMPOS substitutes the wallet and worker name from the profile. The pool follows from the wallet
# (HeroMiners for a Pearl address); to choose one, add --pool stratum+ssl://host:port to START.
START="./glint --plain --no-log-file --wallet %WALLET% --worker %WORKER% --api-port 4078"
API_URL=http://127.0.0.1:4078/api/stats

# GlintMiner as an MMPOS external (custom) miner. Fields per MMPOS's custom-miner format.
NAME=glint
VERSION=1.2.4
ALGO=pearl
# Start command: MMPOS substitutes the wallet, worker name and pool from the profile.
START="./glint --plain --no-log-file --wallet %WALLET% --worker %WORKER% --api-port 4078"
API_URL=http://127.0.0.1:4078/api/stats
